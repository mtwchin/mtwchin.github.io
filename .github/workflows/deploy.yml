name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Fetch resume from private repo
        uses: actions/checkout@v4
        with:
          repository: mtwchin/mindscape
          token: ${{ secrets.RESUME_REPO_TOKEN }}
          sparse-checkout: |
            01 Career/Matthew_Chin_resume.pdf
          sparse-checkout-cone-mode: false
          path: resume-src

      - name: Copy resume into public
        run: cp "resume-src/01 Career/Matthew_Chin_resume.pdf" public/resume.pdf

      - name: Build
        run: npm run build
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

